---
# Elasticsearch / Kibana（es-stack）
# Apple Silicon では ansible_architecture が aarch64 になる。Beats 導入時は elastic_deb_arch を使う。

elastic_deb_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

# elastic_stack_major : apt リポジトリのメジャーバージョン
elastic_stack_major: "8"
# elastic_version : インストールする ES / Kibana のバージョン
elastic_version: "8.15.0"
elasticsearch_cluster_name: elasticsearch-lab
# JVM heap。es-stack は 4G VM なので 1g
elasticsearch_heap_size: "1g"

# 検証用に認証・TLS オフ（Fleet 利用時は true）
elasticsearch_lab_security_enabled: false
kibana_enable: true
kibana_i18n_locale: "ja-JP"
fleet_enable: false
fleet_url: ""
fleet_enrollment_token: ""

# target の Filebeat 等が参照する。inventory の es-stack IP から組み立てる
elasticsearch_host: "http://{{ hostvars['es-stack']['ansible_host'] }}:9200"
kibana_host: "http://{{ hostvars['es-stack']['ansible_host'] }}:5601"

#--------------------------------
# 検証ログ（targets）
#--------------------------------
es_lab_log_dir: /var/log/es-lab
es_lab_log_file: /var/log/es-lab/app.log
es_lab_service_name: dummy-app
es_lab_paths:
  - /api/ping
es_lab_log_interval: 60s
filebeat_enable: true
