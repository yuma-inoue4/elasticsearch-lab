---
# 非推奨: VM 作成はホストの bash scripts/vms-create.sh に移した（docs/tmp-memo/kaitei-an.md）。
# Ansible は es-controller 上で playbook/site.yaml を実行する。
#--------------------------------
# Multipass VM を作成（旧方式・使わない）
#--------------------------------
# 方針:
#   - 異常 VM（Suspended / IP なし Running 等）を launch 前に delete --purge する
#     … 名前だけ存在する VM を「作成済み」と誤認すると launch をスキップし daemon が詰まる
#   - launch は 1 台ずつ、24.04 LTS 固定、--timeout 付き
#   - launch / start 後は IPv4 が付くまで待ってから次へ
#   - list / launch に async 上限を付け、無限待ちを防ぐ
# 注意:
#   - launch 中の Ctrl+C は Windows 側 multipassd を無応答にしやすい
#   - 無応答時は scripts/support/multipass-daemon-fix.sh（UAC 承認）でサービスを再起動する
#--------------------------------

#--------------------------------
# Play1. Multipass VMセットアップ
#--------------------------------
- name: Multipass VM を作成
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    #--------------------------------
    # 1. 実行環境の取得と OS 別変数の選択
    #--------------------------------
    - name: Ansibleの実行環境を取得
      ansible.builtin.setup:
        gather_subset: [min]

    - name: OS別変数を選択
      ansible.builtin.set_fact:
        mp_cmd: "{{ mp_cmd_win if ansible_facts['system'] == 'Linux' else mp_cmd_mac }}"
        
        # 制御ノード上のファイル操作用パス（keygen / dirname / chmod）
        ssh_key_path: "{{ ssh_private_key_win_fs if ansible_facts['system'] == 'Linux' else ssh_private_key_mac }}"
        ssh_pubkey_path: "{{ ssh_public_key_win_fs if ansible_facts['system'] == 'Linux' else ssh_public_key_mac }}"
        
        # VM への SSH 接続用（次プレイ以降のホスト変数としても利用）
        ansible_ssh_private_key_file: "{{ ssh_private_key_win if ansible_facts['system'] == 'Linux' else ssh_private_key_mac }}"
        ansible_ssh_executable: "{{ ssh_executable_win if ansible_facts['system'] == 'Linux' else ssh_executable_mac }}"

    - name: 選択した OS 別変数を表示
      ansible.builtin.debug:
        msg:
          - "system              : {{ ansible_facts['system'] }}"
          - "mp_cmd              : {{ mp_cmd }}"
          - "ssh_key_path        : {{ ssh_key_path }}"
          - "ssh_pubkey_path     : {{ ssh_pubkey_path }}"
          - "ansible_ssh_private_key_file : {{ ansible_ssh_private_key_file }}"
          - "ansible_ssh_executable       : {{ ansible_ssh_executable }}"

    #--------------------------------
    # 2. 現状の VM 一覧を取得
    #--------------------------------
    # list がハングすると以降の mp も全部止まる。async で打ち切って修復手順を出す。
    - name: Multipass の応答確認と VM 一覧取得
      block:
        - name: 稼働中の VM 一覧を JSON で取得
          ansible.builtin.command: "{{ mp_cmd }} list --format json"
          register: mp_list_json
          async: "{{ mp_daemon_timeout | int }}"
          poll: 5
          changed_when: false
      rescue:
        - name: Multipass が無応答なら修復手順を案内して中断
          ansible.builtin.fail:
            msg: >-
              multipassd が {{ mp_daemon_timeout }} 秒以内に応答しません。
              launch の途中で Ctrl+C すると Windows 側デーモンが詰まりやすいです。
              修復: bash {{ playbook_dir }}/../../scripts/support/multipass-daemon-fix.sh
              （UAC で「はい」のあと mp list が数秒で返ることを確認）

    - name: 既存 VM レコードを保存
      ansible.builtin.set_fact:
        mp_vm_records: "{{ (mp_list_json.stdout | from_json).list }}"
        mp_wanted_names: "{{ mp_vms | map(attribute='name') | list }}"

    # Running かつ IPv4 あり … そのまま使う
    - name: 正常稼働中 VM 名を特定
      ansible.builtin.set_fact:
        mp_vms_ready_names: >-
          {{ mp_vm_records
             | selectattr('name', 'in', mp_wanted_names)
             | selectattr('state', 'equalto', 'Running')
             | selectattr('ipv4', 'defined')
             | rejectattr('ipv4', 'equalto', [])
             | map(attribute='name') | list }}

    # Stopped … start すればよい（削除しない）
    - name: 起動待ち VM 名を特定（Stopped）
      ansible.builtin.set_fact:
        mp_vms_stopped_names: >-
          {{ mp_vm_records
             | selectattr('name', 'in', mp_wanted_names)
             | selectattr('state', 'equalto', 'Stopped')
             | map(attribute='name') | list }}

    # Suspended / IP なし Running 等 … start も launch も詰まるので purge して作り直す
    # （Multipass 上に実在するが正常でない VM のみ。未作成 VM は broken に含めない）
    - name: 削除して作り直す VM 名を特定
      ansible.builtin.set_fact:
        mp_vms_broken_names: >-
          {{ mp_vm_records
             | selectattr('name', 'in', mp_wanted_names)
             | rejectattr('name', 'in', mp_vms_ready_names)
             | rejectattr('name', 'in', mp_vms_stopped_names)
             | map(attribute='name') | list }}

    - name: 新規 launch 対象 VM 名を特定
      ansible.builtin.set_fact:
        mp_vms_missing_names: >-
          {{ mp_wanted_names | difference(mp_vm_records | map(attribute='name') | list) }}

    - name: launch 対象 VM 定義を作成
      ansible.builtin.set_fact:
        mp_vms_to_launch: >-
          {{ mp_vms
             | selectattr('name', 'in', mp_vms_missing_names + mp_vms_broken_names)
             | list }}

    - name: VM 状態の分類結果を表示
      ansible.builtin.debug:
        msg:
          - "正常（そのまま） : {{ mp_vms_ready_names }}"
          - "起動のみ       : {{ mp_vms_stopped_names }}"
          - "削除→作り直し  : {{ mp_vms_broken_names }}"
          - "新規 launch    : {{ mp_vms_missing_names }}"
          - "launch 実行    : {{ mp_vms_to_launch | map(attribute='name') | list }}"

    #--------------------------------
    # 3. 異常 VM を削除（launch 前に必須）
    #--------------------------------
    - name: 異常 VM を強制停止
      ansible.builtin.command: "{{ mp_cmd }} stop --force {{ item }}"
      loop: "{{ mp_vms_broken_names }}"
      when: mp_vms_broken_names | length > 0
      failed_when: false
      changed_when: false
      async: "{{ mp_daemon_timeout | int }}"
      poll: 5

    - name: 異常 VM を完全削除
      ansible.builtin.command: "{{ mp_cmd }} delete --purge {{ item }}"
      loop: "{{ mp_vms_broken_names }}"
      when: mp_vms_broken_names | length > 0
      failed_when: false
      changed_when: false
      async: "{{ mp_daemon_timeout | int }}"
      poll: 5

    - name: 削除後の待機（Windows Multipass の daemon 解放）
      ansible.builtin.pause:
        seconds: "{{ mp_launch_pause_sec | int }}"
      when: mp_vms_broken_names | length > 0

    #--------------------------------
    # 4. VM を launch / start
    #--------------------------------
    - name: VM を 1 台ずつ launch
      ansible.builtin.command: >
        {{ mp_cmd }} launch {{ mp_image }}
        --name {{ item.name }}
        --memory {{ item.memory }}
        --cpus {{ item.cpus }}
        --disk {{ item.disk | default('5G') }}
        --timeout {{ mp_launch_timeout | int }}
      loop: "{{ mp_vms_to_launch }}"
      when: mp_vms_to_launch | length > 0
      register: mp_launch_result
      async: "{{ (mp_launch_timeout | int) + 60 }}"
      poll: 15

    - name: launch 後の待機
      ansible.builtin.pause:
        seconds: "{{ mp_launch_pause_sec | int }}"
      when: mp_vms_to_launch | length > 0

    - name: 停止中 VM を起動
      ansible.builtin.command: "{{ mp_cmd }} start {{ item }}"
      loop: "{{ mp_vms_stopped_names }}"
      when: mp_vms_stopped_names | length > 0
      async: "{{ mp_launch_timeout | int }}"
      poll: 15

    #--------------------------------
    # 5. 全 VM の IPv4 取得待ち
    #--------------------------------
    - name: 全 VM の IPv4 取得待ち
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_ip_wait
      until: >
        ((mp_ip_wait.stdout | from_json).list
        | selectattr('name', 'equalto', item)
        | map(attribute='ipv4') | first | default([])) | length > 0
      retries: "{{ mp_wait_ip_retries | int }}"
      delay: "{{ mp_wait_ip_delay | int }}"
      loop: "{{ mp_wanted_names }}"
      changed_when: false

    #--------------------------------
    # 6. 作成結果を取り直して debug
    #--------------------------------
    - name: 作成後の VM 一覧を再取得
      block:
        - name: 作成後の VM 一覧を JSON で再取得
          ansible.builtin.command: "{{ mp_cmd }} list --format json"
          register: mp_list_after_json
          async: "{{ mp_daemon_timeout | int }}"
          poll: 5
          changed_when: false
      rescue:
        - name: 作成後に Multipass が無応答なら修復手順を案内して中断
          ansible.builtin.fail:
            msg: >-
              launch のあとに multipassd が応答しません。
              修復: bash {{ playbook_dir }}/../../scripts/support/multipass-daemon-fix.sh


    - name: VM一覧を後続プレイ用に保存（IPv4 付きのみ）
      ansible.builtin.set_fact:
        mp_vm_list: >-
          {{ (mp_list_after_json.stdout | from_json).list
             | selectattr('name', 'in', mp_vms | map(attribute='name') | list)
             | selectattr('ipv4', 'defined')
             | rejectattr('ipv4', 'equalto', [])
             | list }}

    - name: 全 VM の IPv4 取得を確認
      ansible.builtin.fail:
        msg: >-
          IPv4 未取得の VM があります（{{ mp_wanted_names | difference(mp_vm_list | map(attribute='name') | list) | join(', ') }}）。
          壊れた VM が残っている場合は mp delete --purge 後に再実行してください。
      when: mp_vm_list | map(attribute='name') | list | sort != mp_wanted_names | sort

    - name: VMの作成結果を表示
      ansible.builtin.debug:
        msg: "{{ mp_vm_list }}"

#--------------------------------
# Play2.VMのIPアドレスの取得 / SSH鍵配布
#--------------------------------
- name: Multipass VM にログインしてセットアップを行う
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: VMのIPアドレスを取得（groups は mp_vms の定義を使う）
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ipv4[0] }}"
        groups: "{{ (mp_vms | selectattr('name', 'equalto', item.name) | map(attribute='groups') | first) | default('ungrouped') }}"
        ansible_user: "{{ ansible_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file }}"
        ansible_ssh_executable: "{{ ansible_ssh_executable }}"
        ansible_ssh_common_args: "{{ ansible_ssh_common_args }}"
      loop: "{{ mp_vm_list }}"
      when: mp_vm_list | length > 0
      register: ansible_hosts

    - name: VMのIPアドレスの取得結果を表示
      ansible.builtin.debug:
        msg: "{{ ansible_hosts.results | map(attribute='add_host.host_vars.ansible_host') | list }}"
      when: mp_vm_list | length > 0

    #--------------------------------
    # SSH 鍵（SSH 前に mp exec で公開鍵を配布する）
    #--------------------------------
    - name: SSH 用 .ssh ディレクトリを用意
      ansible.builtin.file:
        path: "{{ ssh_key_path | dirname }}"
        state: directory
        mode: "0700"

    - name: SSH 鍵ペアを作成（未作成の場合）
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f {{ ssh_key_path }} -N ""
        creates: "{{ ssh_key_path }}"

    # Windows / WSL のみ
    - name: Windows 秘密鍵の ACL を修正（ssh.exe が読めるようにする）
      ansible.builtin.shell: |
        cmd.exe /c "icacls {{ ssh_key_path | replace('/mnt/c/', 'C:\\\\') | replace('/', '\\\\') }} /inheritance:r"
        cmd.exe /c "icacls {{ ssh_key_path | replace('/mnt/c/', 'C:\\\\') | replace('/', '\\\\') }} /grant:r {{ ansible_windows_user }}:(R)"
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_facts['system'] == 'Linux'

    # Mac のみ
    - name: Mac 秘密鍵の権限を設定
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        mode: "0600"
      when: ansible_facts['system'] == 'Darwin'

    - name: 公開鍵の内容を読み込む
      ansible.builtin.set_fact:
        ssh_public_key: "{{ lookup('file', ssh_pubkey_path) }}"

    - name: 公開鍵を VM に配布（未登録の場合のみ追加）
      ansible.builtin.shell: |
        {{ mp_cmd }} exec {{ item.name }} -- bash -lc "mkdir -p ~/.ssh && chmod 700 ~/.ssh && if ! grep -qxF '{{ ssh_public_key }}' ~/.ssh/authorized_keys 2>/dev/null; then echo '{{ ssh_public_key }}' >> ~/.ssh/authorized_keys; echo ADDED; else echo EXISTS; fi; chmod 600 ~/.ssh/authorized_keys"
      loop: "{{ mp_vm_list }}"
      when: mp_vm_list | length > 0
      register: key_deploy
      changed_when: key_deploy.stdout is search('ADDED')

    - name: 動的 inventory 出力用ディレクトリを用意
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../inventory/generated"
        state: directory
        mode: "0755"

    # 動的 inventory : Multipass の現状（VM 名・IP）から名簿を自動生成（IP 変更時は create-vms 再実行）
    - name: 動的 inventory を書き出す（後続 playbook 用）
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/inventory-vms.yaml.j2"
        dest: "{{ playbook_dir }}/../inventory/generated/vms.yaml"
        mode: "0644"

#--------------------------------
# Play3.SSHセットアップ
#--------------------------------
- name: SSHセットアップ
  hosts: target:es-stack
  connection: ssh
  gather_facts: false
  tasks:

    - name: SSH 疎通確認（raw … VM の Python 3.14 は Ansible 2.10 の ping と非互換）
      ansible.builtin.raw: echo pong
      register: ssh_check
      changed_when: false

    - name: 接続先を表示
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} → {{ ansible_host }} : {{ ssh_check.stdout | trim }}"
