# Playbook は es-controller 上で実行する（ホストの Ansible は使わない）
# 起動: bash scripts/vms-create.sh / 作り込み: bash scripts/controller-ansible-run.sh

[defaults]
inventory = ./inventory/hosts.yaml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPath=none
