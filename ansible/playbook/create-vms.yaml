---
#--------------------------------
# VM 作成 playbook（Step 5）
#--------------------------------
# 実行:
#   cd ~/repo/elasticsearch-lab/ansible
#   ansible-playbook playbook/create-vms.yaml
#
# 方針:
#   - 1 ファイル・Play 1 つで完結（include_tasks なし）
#   - 既存 VM はスキップ（冪等）
#   - launch は loop で 1 台ずつ（Ansible は前の完了を待ってから次へ）
#   - 各 launch 後に sleep（Windows Multipass の連続起動対策）
#   - 最後に list を取り直して debug 表示
#--------------------------------

#--------------------------------
# Play1. Multipass VMセットアップ
#--------------------------------
- name: Multipass VM を作成する
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    #--------------------------------
    # 1. 現状の VM 一覧を取得
    #--------------------------------
    - name: 稼働中の VM 一覧を JSON で取得
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_list_json
      changed_when: false

    - name: 稼働中の VM 名一覧を作成
      ansible.builtin.set_fact:
        mp_existing_names: "{{ (mp_list_json.stdout | from_json).list | map(attribute='name') | list }}"

    - name: 作成対象を絞り込む（未作成だけ）
      ansible.builtin.set_fact:
        mp_vms_to_create: "{{ mp_vms | rejectattr('name', 'in', mp_existing_names) | list }}"

    - name: 作成前の状態を表示
      ansible.builtin.debug:
        msg:
          - "稼働中のVM   : {{ mp_existing_names }}"
          - "作成予定のVM : {{ mp_vms_to_create | map(attribute='name') | list }}"

    #--------------------------------
    # 2. 未作成の VM を作成
    #--------------------------------
    - name: VM を 1 台ずつ作成
      ansible.builtin.shell: |
        {{ mp_cmd }} launch \
        --name {{ item.name }} \
        --memory {{ item.memory }} \
        --cpus {{ item.cpus }} \
        && sleep 5
      args:
        executable: /bin/bash # Bashを使用する事を明示
      loop: "{{ mp_vms_to_create }}"
      when: mp_vms_to_create | length > 0

    #--------------------------------
    # 3. 作成結果を取り直して debug
    #--------------------------------
    - name: 作成後の VM 一覧を JSON で再取得
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_list_after_json
      changed_when: false

    - name: VMの作成結果を表示
      ansible.builtin.debug:
        msg: "{{ (mp_list_after_json.stdout | from_json).list }}"

#--------------------------------
# Play2.VMのIPアドレスの取得
#--------------------------------
- name: Multipass VM にログインしてセットアップを行う
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: VMのIPアドレスを取得
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ipv4[0] }}"
        group: "{{ vm_group }}"
      loop: "{{ (mp_list_after_json.stdout | from_json).list }}"
      when: mp_list_after_json | length > 0
      register: ansible_hosts

    - name: VMのIPアドレスの取得結果を表示
      ansible.builtin.debug:
        msg: "{{ ansible_hosts.results | map(attribute='add_host.host_vars.ansible_host') | list }}"

#--------------------------------
# Play3.SSHセットアップ
#--------------------------------
- name: SSHセットアップ
  hosts: "{{ vm_group }}"
  connection: ssh
  gather_facts: false
  tasks:
