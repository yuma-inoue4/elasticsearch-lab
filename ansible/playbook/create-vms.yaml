---
#--------------------------------
# VM 作成 playbook（Step 5）
#--------------------------------
# 実行:
#   cd ~/repo/elasticsearch-lab/ansible
#   ansible-playbook playbook/create-vms.yaml
#
# 方針:
#   - 1 ファイル・Play 1 つで完結（include_tasks なし）
#   - 既存 VM はスキップ（冪等）
#   - launch は loop で 1 台ずつ（Ansible は前の完了を待ってから次へ）
#   - 各 launch 後に sleep（Windows Multipass の連続起動対策）
#   - 最後に list を取り直して debug 表示
#--------------------------------

#--------------------------------
# Play1. Multipass VMセットアップ
#--------------------------------
- name: Multipass VM を作成する
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    #--------------------------------
    # 1. 現状の VM 一覧を取得
    #--------------------------------
    - name: 稼働中の VM 一覧を JSON で取得
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_list_json
      changed_when: false

    - name: 稼働中の VM 名一覧を作成
      ansible.builtin.set_fact:
        mp_existing_names: "{{ (mp_list_json.stdout | from_json).list | map(attribute='name') | list }}"

    - name: 作成対象を絞り込む（未作成だけ）
      ansible.builtin.set_fact:
        mp_vms_to_create: "{{ mp_vms | rejectattr('name', 'in', mp_existing_names) | list }}"

    - name: 作成前の状態を表示
      ansible.builtin.debug:
        msg:
          - "稼働中のVM   : {{ mp_existing_names }}"
          - "作成予定のVM : {{ mp_vms_to_create | map(attribute='name') | list }}"

    #--------------------------------
    # 2. 未作成の VM を作成
    #--------------------------------
    - name: VM を 1 台ずつ作成
      ansible.builtin.shell: |
        {{ mp_cmd }} launch \
        --name {{ item.name }} \
        --memory {{ item.memory }} \
        --cpus {{ item.cpus }} \
        && sleep 5
      args:
        executable: /bin/bash # Bashを使用する事を明示
      loop: "{{ mp_vms_to_create }}"
      when: mp_vms_to_create | length > 0

    #--------------------------------
    # 3. 作成結果を取り直して debug
    #--------------------------------
    - name: 作成後の VM 一覧を JSON で再取得
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_list_after_json
      changed_when: false

    - name: VMの作成結果を表示
      ansible.builtin.debug:
        msg: "{{ (mp_list_after_json.stdout | from_json).list }}"

#--------------------------------
# Play2.VMのIPアドレスの取得
#--------------------------------
- name: Multipass VM にログインしてセットアップを行う
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: VMのIPアドレスを取得
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ipv4[0] }}"
        groups: target
      loop: "{{ (mp_list_after_json.stdout | from_json).list }}"
      when: (mp_list_after_json.stdout | from_json).list | length > 0
      register: ansible_hosts

    - name: VMのIPアドレスの取得結果を表示
      ansible.builtin.debug:
        msg: "{{ ansible_hosts.results | map(attribute='add_host.host_vars.ansible_host') | list }}"

    #--------------------------------
    # SSH 鍵（SSH 前に mp exec で公開鍵を配布する）
    #--------------------------------
    - name: SSH 用 .ssh ディレクトリを用意
      ansible.builtin.file:
        path: "{{ ansible_ssh_private_key_file_wsl | dirname }}"
        state: directory
        mode: "0700"

    - name: SSH 鍵ペアを作成（未作成の場合）
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f {{ ansible_ssh_private_key_file_wsl }} -N ""
        creates: "{{ ansible_ssh_private_key_file_wsl }}"

    - name: Windows 秘密鍵の ACL を修正（ssh.exe が読めるようにする）
      ansible.builtin.shell: |
        cmd.exe /c "icacls {{ ansible_ssh_private_key_file_wsl | replace('/mnt/c/', 'C:\\\\') | replace('/', '\\\\') }} /inheritance:r"
        cmd.exe /c "icacls {{ ansible_ssh_private_key_file_wsl | replace('/mnt/c/', 'C:\\\\') | replace('/', '\\\\') }} /grant:r {{ ansible_windows_user }}:(R)"
      args:
        executable: /bin/bash
      changed_when: false

    - name: 公開鍵の内容を読み込む
      ansible.builtin.set_fact:
        ssh_public_key: "{{ lookup('file', ansible_ssh_public_key_file) }}"

    - name: 公開鍵を VM に配布（未登録の場合のみ追加）
      ansible.builtin.shell: |
        {{ mp_cmd }} exec {{ item.name }} -- bash -lc "mkdir -p ~/.ssh && chmod 700 ~/.ssh && if ! grep -qxF '{{ ssh_public_key }}' ~/.ssh/authorized_keys 2>/dev/null; then echo '{{ ssh_public_key }}' >> ~/.ssh/authorized_keys; echo ADDED; else echo EXISTS; fi; chmod 600 ~/.ssh/authorized_keys"
      loop: "{{ (mp_list_after_json.stdout | from_json).list }}"
      when: (mp_list_after_json.stdout | from_json).list | length > 0
      register: key_deploy
      changed_when: key_deploy.stdout is search('ADDED')

#--------------------------------
# Play3.SSHセットアップ
#--------------------------------
- name: SSHセットアップ
  hosts: target
  connection: ssh
  gather_facts: false
  tasks:

    - name: SSH 疎通確認（raw … VM の Python 3.14 は Ansible 2.10 の ping と非互換）
      ansible.builtin.raw: echo pong
      register: ssh_check
      changed_when: false

    - name: 接続先を表示
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} → {{ ansible_host }} : {{ ssh_check.stdout | trim }}"

