---
#--------------------------------
# Playbook の基本的な構造
#--------------------------------
# ---                          # playbook 開始を示す
# - name: Play の説明          # Playbookの1区切り(配列)をPlayと呼ぶ
#   hosts: localhost　　　　　　# 対象のホストを指定
#   tasks:                     # 実際に行う処理を追記
#     - name: タスク1           
#       ansible.builtin.command: ...
#     - name: タスク2
#       ansible.builtin.debug: ...

#--------------------------------
# 補足
#--------------------------------
#   ansible.builtin.{モジュール名}
#   -> Ansibleの標準モジュールを呼び出して使用する
#      モジュール名は、ansible-doc コマンドで確認できる
#       例) ansible-doc -l | grep {モジュール名}
#       例) ansible-doc -s {モジュール名} ※ ひな形を表示
#
#   register: 変数名
#   -> タスクの実行結果を変数に格納する
# 
#   changed_when: false
#   -> タスクによってサーバーの状態が変更されたか？を記録する変数
#      確認・表示だけのタスクは、状態変更しないため、明示的に false を格納
#
#   gather_facts: false
#   -> ホスト情報収集の有無(OS, CPUなど)を無効化
# 
#   connection: local
#   -> VMにSSHせず、ローカルで実行

#--------------------------------
# Playbook
#--------------------------------
- name: VMの作成
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: 01-現在のVM情報を取得 
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_list_json
      changed_when: false

    - name: 02-現在のVM情報を更新
      ansible.builtin.command: "{{ mp_cmd }} list --format json"
      register: mp_list_json
      changed_when: false

    - name: 03-現在のVM名とIPを取得 
      ansible.builtin.set_fact:
        mp_existing_ips_and_names: "{{ (mp_list_json.stdout | from_json).list}}"
      changed_when: false

    - name: 04-VMのIPを追加
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: "{{ group_name }}"
        ansible_host: "{{ item.ipv4[0] }}"
      when: item.name not in mp_existing_ips_and_names
      loop: "{{ mp_existing_ips_and_names }}"
      register: add_host_result

#--------------------------------
# Playbook
#--------------------------------
- name: 追加した VM を確認
  hosts: workers
  gather_facts: false
  tasks:
  - ansible.builtin.debug:
      msg: "{{ inventory_hostname }} → {{ ansible_host }}"