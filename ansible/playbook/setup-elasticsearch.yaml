---
# vm-es-stack 向け Elasticsearch / Kibana セットアップ
# 前提: create-vms.yaml 実行済み（inventory/generated/vms.yaml が存在すること）

#--------------------------------
# 4. vm-es-stack 上の OS / パッケージ設定
#    ES が動くための土台を VM 内に整える
#--------------------------------
- name: Setup Elasticsearch on es-stack
  hosts: es-stack
  become: true
  tasks:

    # vm.max_map_count : ES がメモリを細かくマップするために必要なカーネル設定（Elastic 推奨値 262144）
    - name: vm.max_map_count を設定
      ansible.builtin.command: sysctl -w vm.max_map_count=262144
      changed_when: true

    # 再起動後も設定が残るよう永続化
    - name: 永続化 vm.max_map_count
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/99-elasticsearch.conf
        line: vm.max_map_count=262144
        create: true
        mode: "0644"

    # apt リポジトリ追加や GPG 取得に使う基本ツール
    - name: 基本パッケージをインストール
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: true

    # GPG キー : 公式パッケージであることを確認するための署名
    - name: Elastic GPG キーを配置
      ansible.builtin.shell: |
        curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch \
          | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
        chmod 644 /usr/share/keyrings/elasticsearch-keyring.gpg
      args:
        creates: /usr/share/keyrings/elasticsearch-keyring.gpg

    # apt リポジトリ : Ubuntu 標準には無いので Elastic 公式から elasticsearch を入れる
    - name: Elastic apt リポジトリを追加
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/elastic-{{ elastic_stack_major }}.x.list
        mode: "0644"
        content: |
          deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/{{ elastic_stack_major }}.x/apt stable main

    # データ・ログ用ディレクトリ : ES プロセス（elasticsearch ユーザー）が読み書きできるようにする
    - name: Elasticsearch 用ディレクトリを用意
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: "0750"
      loop:
        - /var/lib/elasticsearch      # インデックスなどデータ本体
        - /var/log/elasticsearch      # ログ
        - /usr/share/elasticsearch/logs  # 起動時 log4j が参照（無いと起動失敗しうる）

    - name: Elasticsearch をインストール
      ansible.builtin.apt:
        name: "elasticsearch={{ elastic_version }}*"
        state: present
        update_cache: true

    #--------------------------------
    # 5. Elasticsearch の設定（/etc/elasticsearch/elasticsearch.yml）
    #    9200 で待ち受け、target からデータを受け取れるようにする
    #--------------------------------
    - name: elasticsearch.yml を配置
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/elasticsearch.yml.j2"
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: "0660"
      notify: Restart elasticsearch

    # JVM heap : Java が使うメモリ上限（4G VM なので 1g に抑え、OS・Kibana 用に残す）
    - name: JVM heap を配置
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/jvm.heap.options.j2"
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        owner: root
        group: elasticsearch
        mode: "0644"
      notify: Restart elasticsearch

    - name: Elasticsearch を起動
      ansible.builtin.systemd:
        name: elasticsearch
        state: started
        enabled: true
        daemon_reload: true

    - name: Elasticsearch の起動待ち
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 9200
        delay: 5
        timeout: 180

    - name: Elasticsearch 疎通確認
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9200"
        method: GET
        status_code: 200
      register: es_health
      retries: 5
      delay: 10
      until: es_health.status == 200

    - name: Elasticsearch 疎通結果を表示
      ansible.builtin.debug:
        msg: "{{ es_health.json }}"

  handlers:
    - name: Restart elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted
        daemon_reload: true

#--------------------------------
# 6. Kibana の設定
#    ES の中身をブラウザで見る Web UI（5601）
#--------------------------------
- name: Setup Kibana on es-stack
  hosts: es-stack
  become: true
  tasks:

    - name: Kibana をインストール
      ansible.builtin.apt:
        name: "kibana={{ elastic_version }}*"
        state: present
        update_cache: true
      when: kibana_enable | default(true) | bool

    - name: kibana.yml を配置
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kibana.yml.j2"
        dest: /etc/kibana/kibana.yml
        owner: kibana
        group: kibana
        mode: "0640"
      notify: Restart kibana
      when: kibana_enable | default(true) | bool

    - name: Kibana を起動
      ansible.builtin.systemd:
        name: kibana
        state: started
        enabled: true
        daemon_reload: true
      when: kibana_enable | default(true) | bool

    - name: Kibana の起動待ち
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 5601
        delay: 10
        timeout: 300
      when: kibana_enable | default(true) | bool

    - name: Kibana URL を表示
      ansible.builtin.debug:
        msg: "Kibana: http://{{ ansible_host }}:5601"
      when: kibana_enable | default(true) | bool

    - name: Kibana はスキップ
      ansible.builtin.debug:
        msg: "kibana_enable=false のため Kibana は未インストール"
      when: not (kibana_enable | default(true) | bool)

  handlers:
    - name: Restart kibana
      ansible.builtin.systemd:
        name: kibana
        state: restarted
        daemon_reload: true

#--------------------------------
# 8. Fleet（フェーズ3・任意）
#    エージェントの司令塔。今は Filebeat 直送のため未使用（fleet_enable: false）
#--------------------------------
- name: Fleet 設定（任意）
  hosts: es-stack
  gather_facts: false
  tasks:

    - name: Fleet は無効（Filebeat 直送を使用）
      ansible.builtin.debug:
        msg: >-
          fleet_enable=false のため Fleet Server は未設定。
          Elastic Agent を使う場合は elasticsearch_lab_security_enabled を true にし、
          setup-fleet.yaml を実行してください。
      when: not (fleet_enable | default(false) | bool)

    - name: Fleet 有効時の案内
      ansible.builtin.debug:
        msg: >-
          fleet_enable=true ですが、Fleet 自動セットアップは setup-fleet.yaml で実施してください。
          fleet_url={{ fleet_url | default('未設定') }}
      when: fleet_enable | default(false) | bool

#--------------------------------
# 7. 接続先の自動書き出し
#    target の Filebeat 等が「どこに送るか」を読むための URL をファイル化
#--------------------------------
- name: 接続先変数を書き出し
  hosts: es-stack
  gather_facts: false
  tasks:

    - name: target 向け接続先を表示
      ansible.builtin.debug:
        msg:
          - "elasticsearch_host: http://{{ ansible_host }}:9200"
          - "kibana_host: http://{{ ansible_host }}:5601"

    - name: 接続先変数ファイルを書き出す
      ansible.builtin.copy:
        content: |
          ---
          # setup-elasticsearch.yaml が自動生成（IP 変更時は playbook 再実行）
          elasticsearch_host: "http://{{ ansible_host }}:9200"
          kibana_host: "http://{{ ansible_host }}:5601"
          {% if fleet_enable | default(false) | bool %}
          fleet_url: "{{ fleet_url | default('https://' + ansible_host + ':8220') }}"
          fleet_enrollment_token: "{{ fleet_enrollment_token | default('') }}"
          {% endif %}
        dest: "{{ playbook_dir }}/../inventory/generated/elasticsearch.yaml"
        mode: "0644"
      delegate_to: localhost
      run_once: true
