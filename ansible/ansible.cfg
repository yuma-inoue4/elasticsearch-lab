# Playbook の実行時の前提の設定を書くファイル
# 全てのPlaybook で共通のことだけを書くのが基本
#
# playbook の実行例（cd ansible してから）:
#   ansible-playbook playbook/site.yaml

# 何を書くか(よく使うもの)
    # inventory の場所
    # SSH の挙動（ホスト鍵チェックなど）
    # ログの見やすさ

# Ansible コマンドに対するデフォルトの設定
[defaults]

# inventory ファイル(host一覧)の格納場所
inventory = ./inventory

# SSH初回接続時のホスト鍵確認(y/n)を省略
# Ansibleは対話不可のため省略するのが定番
host_key_checking = False

# Playbook失敗時に エラー出力ファイル(.retry) を作らない
# 個人環境では無効化するのが定番
retry_files_enabled = False